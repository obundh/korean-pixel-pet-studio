name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # GitHub's ephemeral runner cannot grant Electron's downloaded helper
      # the root-owned SUID bit, so only this isolated smoke uses --no-sandbox.
      - run: xvfb-run --auto-servernum npm run smoke:quick-pet:ci
